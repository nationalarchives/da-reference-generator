name: DA Reference Generator Lambda Tests
on:
  pull_request:
  push:
    branches-ignore:
      - main
      - release-*
permissions:
  id-token: write
  contents: write
jobs:
  check:
    name: Check terraform
    uses: nationalarchives/tdr-github-actions/.github/workflows/terraform_check.yml@f318ce8a5d99c08b1235663f97fdb1b35844674e # v0.0.39
    with:
      terraform-version: 1.12.2
      working-directory: terraform
    secrets:
      MANAGEMENT_ACCOUNT: ${{ secrets.TDR_MANAGEMENT_ACCOUNT }}
      WORKFLOW_PAT: ${{ secrets.TDR_WORKFLOW_PAT }}
  test:
    name: Lambda test
    uses: nationalarchives/tdr-github-actions/.github/workflows/tdr_test.yml@f318ce8a5d99c08b1235663f97fdb1b35844674e # v0.0.39
    with:
      repo-name: da-reference-generator
      test-command: |
        sbt test
      java-version: '17'  
    secrets:
      SLACK_WEBHOOK: ${{ secrets.TDR_SLACK_WEBHOOK }}
